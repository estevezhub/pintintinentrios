<title>Dojo de Pintintín</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EFF1EE; --surface:#FFFFFF; --surface-2:#E7EBE7;
  --ink:#14201C; --ink-2:#5A6B65; --ink-3:#8A9A93;
  --line:#D3DAD5; --line-2:#C0CAC3;
  --felt:#23473C; --felt-2:#18332B; --felt-line:#33604F; --felt-ink:#CFE0D7;
  --bone:#F7F4EC; --bone-edge:#DDD6C6; --pip:#1A1F1D;
  --gold:#9E6E22; --gold-bg:#F5EBD8;
  --ok:#1F7A5C; --ok-bg:#DDEFE7;
  --bad:#A13B2E; --bad-bg:#F6E3DF;
  --warn:#8A6A1B; --warn-bg:#F7EFDA;
  --p0:#1F7A5C; --p1:#9E6E22; --p2:#5C5A9E;
  --d:#14201C0F;
  --f-disp:"Bricolage Grotesque","Archivo",system-ui,sans-serif;
  --f-ui:"Archivo",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#111614; --surface:#1A211E; --surface-2:#232B27;
  --ink:#E8EEEA; --ink-2:#93A39C; --ink-3:#6B7A74;
  --line:#2A3430; --line-2:#37433E;
  --felt:#1B3A31; --felt-2:#122620; --felt-line:#2C5647; --felt-ink:#BFD5CA;
  --bone:#EFEAE0; --bone-edge:#B9B2A3; --pip:#141816;
  --gold:#D6A354; --gold-bg:#3A2E18;
  --ok:#48B389; --ok-bg:#163025;
  --bad:#D9705E; --bad-bg:#3A1F1A;
  --warn:#D9B45E; --warn-bg:#33290F;
  --p0:#48B389; --p1:#D6A354; --p2:#9B92E0;
  --d:#00000040;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111614; --surface:#1A211E; --surface-2:#232B27;
  --ink:#E8EEEA; --ink-2:#93A39C; --ink-3:#6B7A74;
  --line:#2A3430; --line-2:#37433E;
  --felt:#1B3A31; --felt-2:#122620; --felt-line:#2C5647; --felt-ink:#BFD5CA;
  --bone:#EFEAE0; --bone-edge:#B9B2A3; --pip:#141816;
  --gold:#D6A354; --gold-bg:#3A2E18;
  --ok:#48B389; --ok-bg:#163025;
  --bad:#D9705E; --bad-bg:#3A1F1A;
  --warn:#D9B45E; --warn-bg:#33290F;
  --p0:#48B389; --p1:#D6A354; --p2:#9B92E0;
  --d:#00000040;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 44px}
h1,h2,h3{margin:0;font-family:var(--f-disp);text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(24px,4.6vw,34px);font-weight:800;line-height:1.03}
h2{font-size:14.5px;font-weight:700}
h3{font-size:13px;font-weight:700}
.eyebrow{font-family:var(--f-num);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sub{color:var(--ink-2);max-width:56ch;margin-top:5px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
.panel-bd{padding:13px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.pcard::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line-2)}
.pcard.turn{border-color:var(--gold)} .pcard.turn::before{background:var(--gold)}
.pcard.me::before{background:var(--ok)}
.pname{font-family:var(--f-disp);font-weight:700;font-size:13.5px}
.score{font-family:var(--f-num);font-weight:600;font-size:25px;letter-spacing:-.02em;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-num);font-size:9.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 7px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip.g{background:var(--gold-bg);color:var(--gold)}
.chip.k{background:var(--ok-bg);color:var(--ok)}
.chip.b{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
/* felt */
.felt{background:linear-gradient(168deg,var(--felt) 0%,var(--felt-2) 100%);border:1px solid var(--felt-line);border-radius:10px;padding:12px;color:var(--felt-ink)}
.felt-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.felt .eyebrow{color:#ffffff66}
.mesa{position:relative;overflow:auto;background:#0000001f;border-radius:8px;box-shadow:inset 0 1px 3px #0000002e;min-height:150px;padding:12px}
.mesa-in{position:relative;margin:0 auto}
.mesa{display:flex;align-items:center;justify-content:center}
.empty{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;color:#ffffff7a;text-align:center;padding:16px}
/* tiles */
.t{position:relative;background:var(--bone);border:1px solid var(--bone-edge);border-radius:4px;overflow:hidden;box-shadow:0 1px 3px #00000055;display:flex;padding:0;font:inherit}
.t.col{flex-direction:column}
.t .h{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%;gap:7%}
.t .h+.h{box-shadow:inset 1px 0 0 var(--bone-edge)}
.t.col .h+.h{box-shadow:inset 0 1px 0 var(--bone-edge)}
.t i{border-radius:50%;background:var(--pip);display:block;width:100%;height:100%}
.t.ph{position:absolute}
.t.q0{box-shadow:inset 0 -3px 0 var(--p0),0 1px 3px #00000055}
.t.q1{box-shadow:inset 0 -3px 0 var(--p1),0 1px 3px #00000055}
.t.q2{box-shadow:inset 0 -3px 0 var(--p2),0 1px 3px #00000055}
.t.col.q0{box-shadow:inset -3px 0 0 var(--p0),0 1px 3px #00000055}
.t.col.q1{box-shadow:inset -3px 0 0 var(--p1),0 1px 3px #00000055}
.t.col.q2{box-shadow:inset -3px 0 0 var(--p2),0 1px 3px #00000055}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.lec{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.lecrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.lecrow .et{font-family:var(--f-num);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);min-width:104px;display:flex;align-items:center;gap:5px}
.lecpc{font-family:var(--f-num);font-size:9.5px;color:var(--ink-3);margin-right:5px}
.t.last{outline:2px solid var(--gold);outline-offset:1px}
/* hand */
.hand{display:flex;flex-wrap:wrap;gap:7px;min-height:40px;align-items:center}
button.t{cursor:pointer;transition:transform .09s,box-shadow .09s;box-shadow:0 1px 2px var(--d)}
button.t:disabled{cursor:default;opacity:.5}
button.t:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 5px 10px var(--d)}
button.t.sel{outline:2.5px solid var(--gold);outline-offset:2px;transform:translateY(-4px)}
button.t.ok{box-shadow:0 0 0 1.5px var(--ok),0 1px 2px var(--d)}
button.t:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
/* buttons */
.btn{font:inherit;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)} .btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{opacity:.9;background:var(--ink)}
.btn.sm{font-size:11.5px;padding:5px 9px}
.btnrow{display:flex;flex-wrap:wrap;gap:7px}
.live{margin-top:11px;padding:11px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px}
.live.ok{background:var(--ok-bg);border-color:var(--ok)}
.live.bad{background:var(--bad-bg);border-color:var(--bad)}
.live.warn{background:var(--warn-bg);border-color:var(--warn)}
.live .lt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.live .lw{color:var(--ink-2)}
.live .lf{color:var(--gold);font-weight:600;margin-top:3px}
.live .lz{color:var(--ink-3);font-size:11.5px;margin-top:3px;font-style:italic}
.live.off{color:var(--ink-3);background:var(--surface-2);border-style:dashed}
.sw{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.sw input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer}
.pick{display:flex;gap:7px;align-items:center;margin-top:9px;padding:8px 10px;background:var(--gold-bg);border:1px solid var(--gold);border-radius:7px;flex-wrap:wrap}
.pick span{font-size:12px;color:var(--gold);font-weight:600}
/* readout */
.ro{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:12.5px}
.ro:last-child{border-bottom:0}
.ro b{font-family:var(--f-num);font-weight:500}
.big{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--gold-bg);border:1px solid var(--gold);border-radius:8px;margin-bottom:10px}
.big b{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1;color:var(--gold)}
.big em{font-style:normal;font-size:11.5px;color:var(--gold);font-weight:600}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:12.5px;border:1px solid var(--line-2);background:var(--surface-2)}
.banner b{font-family:var(--f-disp);font-size:13.5px;display:block;margin-bottom:2px}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)}
/* log */
.log{list-style:none;margin:0;padding:0;max-height:210px;overflow-y:auto;font-size:12px}
.log li{display:flex;gap:7px;padding:5px 0;border-bottom:1px dotted var(--line)}
.log li:last-child{border-bottom:0}
.log .n{font-family:var(--f-num);font-size:10px;color:var(--ink-3);flex:none;width:1.8em;text-align:right;padding-top:2px}
.log .tx{flex:1;min-width:0}
.log .pt{font-family:var(--f-num);font-weight:600;color:var(--gold);flex:none}
/* review */
.rev{list-style:none;margin:0;padding:0;font-size:12.5px}
.rev li{padding:9px 0;border-bottom:1px solid var(--line)}
.rev li:last-child{border-bottom:0}
.rev .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.verd{font-family:var(--f-num);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 7px;border-radius:999px}
.verd.ok{background:var(--ok-bg);color:var(--ok)}
.verd.bad{background:var(--bad-bg);color:var(--bad)}
.verd.warn{background:var(--warn-bg);color:var(--warn)}
.verd.nx{background:var(--surface-2);color:var(--ink-3)}
.rev .why{color:var(--ink-2)}
.rev .fix{color:var(--gold);font-weight:600}
/* study */
.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:11px}
.stat{background:var(--surface-2);border-radius:8px;padding:9px 10px}
.stat .k{font-family:var(--f-num);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.2}
.stat .s{font-size:11px;color:var(--ink-2)}
.advice{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--gold);padding-left:10px}
.advice b{color:var(--ink)}
textarea.out{width:100%;min-height:120px;font-family:var(--f-num);font-size:11px;line-height:1.5;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px;resize:vertical;white-space:pre}
select{font:inherit;font-size:12.5px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px}
.tabs{display:flex;gap:5px;margin-bottom:11px;flex-wrap:wrap}
.tab{font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:920px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:1fr;gap:7px}
  .pcard{flex-direction:row;align-items:center;gap:11px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Dominó dominicano · entrenamiento</p>
      <h1>Dojo de Pintintín</h1>
      <p class="sub">Juegas contra dos bots que cuentan los fallos. Al terminar cada mano te dice qué jugadas estuvieron bien, cuáles no, y en cuáles no tenías opción.</p>
    </div>
    <div class="btnrow">
      <select id="nivel" aria-label="Nivel de los bots" title="Sube el nivel para que los bots usen más herramientas">
        <option value="1">1 · Novato — juega al azar</option>
        <option value="2">2 · Casual — suelta alto sin estrecharse</option>
        <option value="3" selected>3 · Jugador — cuenta los fallos</option>
        <option value="4">4 · Fogueado — + predice lo que falta</option>
        <option value="5">5 · Maestro — + cerca y ceba</option>
      </select>
      <button class="btn" id="theme" type="button">Tema</button>
    </div>
  </header>

  <div class="board" id="marcador"></div>

  <div class="grid">
    <div style="display:grid;gap:14px">
      <section class="felt">
        <div class="felt-hd"><p class="eyebrow">La mesa</p><span class="eyebrow num" id="mesa-info"></span></div>
        <div class="mesa" id="mesa"><div class="mesa-in" id="mesa-in"></div></div>
      </section>

      <section class="panel">
        <div class="panel-hd"><h2 id="mano-hd">Tu mano</h2><div style="display:flex;gap:12px;align-items:center"><label class="sw"><input type="checkbox" id="sw-live" checked> Revisión en vivo</label><label class="sw"><input type="checkbox" id="sw-color" checked> Colores</label><span class="eyebrow" id="mano-info"></span></div></div>
        <div class="panel-bd">
          <div class="hand" id="mano"></div>
          <div id="pick"></div>
          <div id="live"></div>
          <div class="btnrow" style="margin-top:11px">
            <button class="btn p" id="nova" type="button">No va</button>
            <button class="btn" id="nueva" type="button">Nueva mano</button>
            <button class="btn" id="reset" type="button">Ronda nueva</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd">
          <h2 id="pan-hd">Estudio</h2>
          <div class="tabs" style="margin:0">
            <button class="tab" id="tb-est" type="button" aria-selected="true">Tu mano</button>
            <button class="tab" id="tb-rev" type="button" aria-selected="false">Revisión</button>
            <button class="tab" id="tb-his" type="button" aria-selected="false">Historial</button>
            <label class="sw" style="margin-left:4px"><input type="checkbox" id="sw-lec" checked> Lectura</label>
          </div>
        </div>
        <div class="panel-bd" id="panel"></div>
      </section>
    </div>

    <div style="display:grid;gap:14px">
      <section class="panel">
        <div class="panel-hd"><h2>Motor</h2><span class="eyebrow">reglas v1.7</span></div>
        <div class="panel-bd">
          <div id="banner"></div>
          <div class="big"><b id="pv">—</b><em id="pv-lbl"></em></div>
          <div id="readout"></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-hd"><h2>Bitácora</h2><span class="eyebrow num" id="log-n"></span></div>
        <div class="panel-bd"><ul class="log" id="log"></ul></div>
      </section>
      <section class="panel">
        <div class="panel-hd"><h2>Exportar</h2><button class="btn sm" id="copy" type="button">Copiar</button></div>
        <div class="panel-bd"><textarea class="out" id="out" readonly spellcheck="false"></textarea></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var PIPS={0:[],1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
var ALL=[];
for(var a=0;a<7;a++)for(var b=a;b<7;b++){ if((a===0&&b===0)||(a===0&&b===1)||(a===1&&b===1))continue; ALL.push(a+"-"+b); }
function K(a,b){return Math.min(a,b)+"-"+Math.max(a,b);}
function F(k){var p=k.split("-");return [+p[0],+p[1]];}
function P(k){var f=F(k);return f[0]+f[1];}
function isD(k){var f=F(k);return f[0]===f[1];}
var ME=0, NOM=["Tú","Bot A","Bot B"];

var S, HIST=[];
function fresh(){
  var loc={}; ALL.forEach(function(k){loc[k]="pila";});
  return {loc:loc,chain:[],sc:[0,0,0],turn:0,last:null,streak:0,fails:0,paid:0,
          log:[],estado:"nada",sel:null,res:null,ganador:null,voids:[{},{},{}],jugo:[{},{},{}],by:{},
          mano0:[],jugadas:[],tab:"est",hist:[],mano:1,pasesMano:0,ultima:null,live:true,color:true,lec:true,modo:"ronda",duo:null,campeon:null};
}
/* ---------- motor ---------- */
function sig(i){ return (S.modo==="subita"&&S.duo)?(i===S.duo[0]?S.duo[1]:S.duo[0]):(i+1)%3; }
function ends(){ return S.chain.length? [S.chain[0].l, S.chain[S.chain.length-1].r] : null; }
function onMesa(k){ return S.loc[k]==="mesa"; }
function alive(n){ return ALL.some(function(k){var f=F(k); return (f[0]===n||f[1]===n) && !onMesa(k);}); }
function caras(){ var e=ends(); if(!e)return {v:[],n:0,m:[]};
  var u = e[0]===e[1]?[e[0]]:[e[0],e[1]];
  return {v:u.filter(alive), n:u.filter(alive).length, m:u.filter(function(n){return !alive(n);})};
}
function hand(i){ return ALL.filter(function(k){return S.loc[k]==="h"+i;}); }
function pila(){ return ALL.filter(function(k){return S.loc[k]==="pila";}); }
function sum(a){ return a.reduce(function(x,k){return x+P(k);},0); }
function sides(k){ var e=ends(); if(!e)return {l:1,r:1,any:1};
  var f=F(k); return {l:(f[0]===e[0]||f[1]===e[0])?1:0, r:(f[0]===e[1]||f[1]===e[1])?1:0,
    any:(f[0]===e[0]||f[1]===e[0]||f[0]===e[1]||f[1]===e[1])?1:0}; }
function legal(i){ var out=[]; hand(i).forEach(function(k){ var s=sides(k);
  if(!ends()){ out.push([k,"r"]); return; } if(s.l)out.push([k,"l"]); if(s.r)out.push([k,"r"]); }); return out; }
function canPlay(i){ return legal(i).length>0; }
function vivo(){ return S.estado==="juego"; }
function primera(){ return !S.sc[0] && !S.sc[1] && !S.sc[2]; }
function lg(tx,pt){ S.log.push({tx:tx,pt:pt||null}); if(S.log.length>260) S.log.splice(0,S.log.length-260); }
function bono(i,p){ if(S.sc[i]>=120) return 0; return Math.max(0,Math.min(p,149-S.sc[i])); }
function endsAfter(k,side){ var e=ends(); var f=F(k);
  if(!e) return [f[0],f[1]];
  var l=e[0], r=e[1];
  if(side==="l") l = (f[0]===e[0])? f[1] : f[0];
  else r = (f[0]===e[1])? f[1] : f[0];
  return [l,r]; }

function play(i,k,side,meta){
  var e=ends(), f=F(k), cap=false;
  if(!e){ S.chain.push({k:k,l:f[0],r:f[1]}); }
  else if(side==="l"){ var o=(f[1]===e[0])?[f[0],f[1]]:[f[1],f[0]]; S.chain.unshift({k:k,l:o[0],r:o[1]});
    if(e[0]!==e[1] && f[0]!==f[1] && ((f[0]===e[0]&&f[1]===e[1])||(f[1]===e[0]&&f[0]===e[1]))) cap=true; }
  else { var o2=(f[0]===e[1])?[f[0],f[1]]:[f[1],f[0]]; S.chain.push({k:k,l:o2[0],r:o2[1]});
    if(e[0]!==e[1] && f[0]!==f[1] && ((f[0]===e[0]&&f[1]===e[1])||(f[1]===e[0]&&f[0]===e[1]))) cap=true; }
  S.by[k]=i;
  S.jugo[i][f[0]]=(S.jugo[i][f[0]]||0)+1; if(f[1]!==f[0]) S.jugo[i][f[1]]=(S.jugo[i][f[1]]||0)+1;
  S.loc[k]="mesa"; S.last=i; S.streak=0; S.fails=0; S.paid=0; S.sel=null; S.estado="juego";
  lg(NOM[i]+" juega "+tl(k)+(e?"":" (salida)"));
  if(i===ME && meta) S.jugadas.push(meta);
  if(hand(i).length===0){ dominada(i,cap); return; }
  S.turn=sig(i); cerrar();
}
function finSub(sal,why){
  var perd=(sal===S.duo[0])?S.duo[1]:S.duo[0];
  lg(NOM[sal]+" SE SALVA ("+why+")");
  lg(NOM[perd]+" queda tercero y PIERDE la ronda");
  S.estado="cerrada"; S.ganador=sal; S.res={t:"sub",w:sal,p:0,cierre:"normal",perd:perd};
}
function dominada(i,cap){
  if(S.modo==="subita"){ finSub(i,"jugó todas sus fichas"); return; }
  var pts=0,pa=[];
  for(var j=0;j<3;j++) if(j!==i){ var s=sum(hand(j)); pts+=s; pa.push(NOM[j]+" "+s); }
  S.sc[i]+=pts; lg(NOM[i]+" DOMINA · "+pa.join(" + "),"+"+pts);
  if(cap){ var cb=bono(i,30); S.sc[i]+=cb; lg("Capicúa"+(cb<30?" (techo 149)":""),cb?("+"+cb):"0"); }
  S.estado="fin"; S.ganador=i; S.res={t:"dom",w:i,p:pts}; cerrar();
}
function noVa(i){
  if(S.modo==="subita"){
    S.streak++; S.sel=null;
    var e0=ends(); if(e0){ S.voids[i][e0[0]]=1; S.voids[i][e0[1]]=1; }
    lg(NOM[i]+" no va · en muerte súbita no se cobran pases");
    if(i===ME) S.jugadas.push({tipo:"paso"});
    if(S.streak>=2){ tranca(); return; }
    S.turn=sig(i); return;
  }
  var c=caras(), v=30*c.n, sal=(S.chain.length===1);
  S.streak++; S.sel=null;
  if(S.last!==null && S.last!==i) S.fails++;
  var f=F("0-0"); var e=ends();
  if(e){ S.voids[i][e[0]]=1; S.voids[i][e[1]]=1; }
  if(S.last===null || S.last===i) lg(NOM[i]+" no va"+(S.last===i?" (es quien jugó)":""));
  else if(v===0) lg(NOM[i]+" no va → nadie cobra: mesa sin caras vivas","0");
  else if(!sal && S.fails<2) lg(NOM[i]+" no va → "+NOM[S.last]+" aún no cobra: fuera de la salida hacen falta los dos","0");
  else {
    var room=Math.max(0,60-S.paid), want=Math.min(v,room);
    if(want<=0) lg(NOM[i]+" no va → tope de 60 alcanzado en esta jugada","0");
    else { var pre=S.sc[S.last], got=bono(S.last,want); S.sc[S.last]+=got; S.paid+=want; if(S.last===ME) S.pasesMano+=got;
      var q = sal? (NOM[i]+" no va en la salida") : "no van los dos";
      if(got===0) lg(q+" → "+NOM[S.last]+" NO cobra: va en "+pre+", desde 120 no entran bonos","0");
      else if(got<want) lg(q+" → "+NOM[S.last]+" cobra "+got+" de "+want+" (techo 149)","+"+got);
      else lg(q+" → "+NOM[S.last]+" cobra · "+c.n+" cara"+(c.n===1?"":"s")+" viva"+(c.n===1?"":"s"),"+"+got);
    }
  }
  if(i===ME) S.jugadas.push({tipo:"paso",turno:S.jugadas.length});
  if(S.streak>=3){ tranca(); return; }
  S.turn=sig(i); cerrar();
}
function tranca(){
  if(S.modo==="subita"){
    var a=S.duo[0], b=S.duo[1], sa=sum(hand(a)), sb=sum(hand(b));
    lg("TRANCA · "+NOM[a]+" "+sa+" · "+NOM[b]+" "+sb);
    if(sa===sb){ var tr=(S.last===a||S.last===b)?S.last:a; finSub(tr,"empate a "+sa+": preferencia del que trancó"); return; }
    finSub(sa<sb?a:b,"se tranca con menos puntos"); return;
  }
  var s=[sum(hand(0)),sum(hand(1)),sum(hand(2))], m=Math.min.apply(null,s);
  var tied=[0,1,2].filter(function(i){return s[i]===m;}), tr=(S.last===null)?0:S.last, w, why;
  if(tied.length===1){ w=tied[0]; why="mano más baja"; }
  else if(tied.indexOf(tr)>=0){ w=tr; why="empate, preferencia del que trancó"; }
  else { for(var q=1;q<=3;q++){ var c=(tr+q)%3; if(tied.indexOf(c)>=0){ w=c; break; } } why="empate sin el que trancó: le sigue en el turno"; }
  var pts=s[0]+s[1]+s[2]; S.sc[w]+=pts;
  lg("TRANCA · "+s.map(function(v,i){return NOM[i]+" "+v;}).join(" · "));
  lg(NOM[w]+" gana la tranca ("+why+")","+"+pts);
  S.estado="fin"; S.ganador=w; S.res={t:"tra",w:w,p:pts,why:why,s:s}; cerrar();
}
function cerrar(){
  if(S.modo==="subita") return;
  if(S.estado!=="fin") return;
  var mx=Math.max.apply(null,S.sc); if(mx<150) return;
  var lo=Math.min.apply(null,S.sc), ab=[0,1,2].filter(function(i){return S.sc[i]===lo;});
  if(ab.length>1){ S.estado="subita"; S.res.cierre="subita"; S.res.emp=ab;
    lg("Ronda cerrada. "+ab.map(function(i){return NOM[i];}).join(" y ")+" quedan iguales → muerte súbita"); }
  else { S.estado="cerrada"; S.res.cierre="normal"; S.res.perd=ab[0];
    lg("Ronda cerrada · "+NOM[ab[0]]+" queda tercero y PIERDE"); }
}

/* ---------- bots ---------- */
function paloLargo(h){ var b=0,n=0; for(var x=0;x<7;x++){ var c=h.filter(function(k){var f=F(k);return f[0]===x||f[1]===x;}).length; if(c>n){n=c;b=x;} } return [b,n]; }
function botMove(i){
  var mv=legal(i), niv=+$("nivel").value;
  if(!mv.length) return null;
  if(niv<=1) return mv[Math.floor(Math.random()*mv.length)];
  var riv=[0,1,2].filter(function(j){return j!==i;});
  var h=hand(i), pl=paloLargo(h), N=pl[0], nk=pl[1];
  var sueltas={};
  if(niv>=5 && nk>=4) ALL.forEach(function(k){ if(!onMesa(k)&&S.loc[k]!=="h"+i){ var f=F(k); if(f[0]===N||f[1]===N) sueltas[k]=1; } });
  var best=null,bs=null;
  mv.forEach(function(m){
    var ne=endsAfter(m[0],m[1]), mios=h.filter(function(x){return x!==m[0];});
    var cov=mios.filter(function(x){var f=F(x);return f[0]===ne[0]||f[1]===ne[0]||f[0]===ne[1]||f[1]===ne[1];}).length;
    var sc;
    if(niv===2){ sc=[cov,P(m[0])]; }
    else {
      var ah=0;
      riv.forEach(function(j){ var v=S.voids[j]; ah += (v[ne[0]]&&v[ne[1]])?2:((v[ne[0]]||v[ne[1]])?1:0); });
      if(niv===3){ sc=[ah,cov,P(m[0])]; }
      else {
        /* predicción: cuántas fichas sin ubicar sirven a las puntas que dejo */
        var amen=0;
        ALL.forEach(function(k){ if(onMesa(k)||S.loc[k]==="h"+i) return;
          var f=F(k); if(f[0]===ne[0]||f[1]===ne[0]||f[0]===ne[1]||f[1]===ne[1]) amen++; });
        if(niv===4){ sc=[ah,-amen,cov,P(m[0])]; }
        else {
          var cerco=(nk>=4)?((ne[0]===N?1:0)+(ne[1]===N?1:0)):0;
          var cebo=0;
          if(nk>=4){ [ne[0],ne[1]].forEach(function(x){ if(x!==N && sueltas[K(x,N)]) cebo++; }); }
          /* medido: añadir un término anti-cebo empeora (28,2% vs 26,4%) */
          sc=[ah,-amen,cerco,cebo,cov,P(m[0])];
        }
      }
    }
    if(bs===null||cmp(sc,bs)>0){ bs=sc; best=m; }
  });
  return best;
}
function cmp(a,b){ for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }

/* ---------- análisis de jugadas ---------- */
function evaluar(i,mv){
  var riv=[0,1,2].filter(function(j){return j!==i;});
  var e=ends();
  var base=mv.map(function(m){
    var ne=endsAfter(m[0],m[1]);
    var cobro=0;
    riv.forEach(function(j){ var v=S.voids[j]; if(v[ne[0]]&&v[ne[1]]) cobro++; });
    var mios=hand(i).filter(function(x){return x!==m[0];});
    var pierde=0;
    if(e){ [e[0],e[1]].forEach(function(n){
      var t1=hand(i).some(function(x){var f=F(x);return f[0]===n||f[1]===n;});
      var t2=mios.some(function(x){var f=F(x);return f[0]===n||f[1]===n;});
      if(t1&&!t2) pierde++; }); }
    var amen=ALL.filter(function(x){
      if(onMesa(x)||S.loc[x]==="h"+i) return false;
      var q=F(x); return q[0]===ne[0]||q[1]===ne[0]||q[0]===ne[1]||q[1]===ne[1]; }).length;
    var cov=mios.filter(function(x){var f=F(x);return f[0]===ne[0]||f[1]===ne[0]||f[0]===ne[1]||f[1]===ne[1];}).length;
    return {m:m,cobro:cobro,pierde:pierde,amen:amen,cov:cov,pts:P(m[0])};
  });
  function ord(f){ return base.slice().sort(function(a,b){ return cmp(f(b),f(a)); }); }
  return {
    base: base,
    cobro:   ord(function(x){return [x.cobro,-x.pierde,-x.amen,x.pts];}),
    tranca:  ord(function(x){return [x.pts,x.cobro,-x.pierde,-x.amen];}),
    dominar: ord(function(x){return [x.cov,x.cobro,-x.pierde,x.pts];})
  };
}
function evalReal(i,mv){
  var riv=[0,1,2].filter(function(j){return j!==i;});
  return mv.map(function(m){
    var ne=endsAfter(m[0],m[1]);
    var f=riv.filter(function(j){
      return !hand(j).some(function(x){var q=F(x);return q[0]===ne[0]||q[1]===ne[0]||q[0]===ne[1]||q[1]===ne[1];});
    }).length;
    return {m:m,f:f};
  });
}
var PLAN={cobro:"cerrar la mesa para cobrar",tranca:"soltar peso para la tranca",dominar:"conservar jugadas para dominar"};
function analizarJugada(m){
  if(m.tipo==="paso") return {v:"nx",t:"Pasaste",w:"No tenías ficha. No hay nada que juzgar."};
  if(m.opciones<=1) return {v:"nx",t:"Forzada",w:"Era tu única jugada legal. Sin decisión, sin error."};
  var sv=m.sirve||[];
  if(sv.length){
    var nombres=sv.map(function(x){return PLAN[x];});
    if(sv.length>1) return {v:"ok",t:"Correcta",
      w:"La mejor jugada bajo "+sv.length+" planes a la vez: "+nombres.join(" y ")+"."};
    return {v:"ok",t:"Correcta",w:"Es la mejor jugada del plan de "+nombres[0]+"."};
  }
  var d=m.mejor;
  if(d.cobro>m.cobro) return {v:"bad",t:"Error de conteo",
     w:"Había una jugada que dejaba las dos puntas donde los dos ya habían fallado, y ningún plan justifica la tuya.",
     f:"Mejor: "+tl(d.k)+"."};
  if(m.pierde>d.pierde) return {v:"bad",t:"Error de veto",
     w:"Quemaste tu última ficha de una cara abierta teniendo alternativa, y sin ganar nada a cambio en ningún plan.",
     f:"Mejor: "+tl(d.k)+"."};
  return {v:"warn",t:"Jugada floja",
     w:"No es la mejor ni para cobrar, ni para aligerar la mano, ni para conservar jugadas. No la condena ningún plan concreto, simplemente había mejores.",
     f:"La más cerrada era "+tl(d.k)+"."};
}

/* ---------- layout serpenteante ---------- */
function layout(chain, maxW){
  var U=25;
  var maxCols=Math.max(9, Math.min(20, Math.floor(maxW/U)-2));
  var out=[], dir=1, y=0, cx=0, col=0;
  for(var i=0;i<chain.length;i++){
    var c=chain[i], dbl=isD(c.k), sig=chain[i+1], sigDbl=sig?isD(sig.k):true;
    var lleno = col+2>maxCols;
    /* La curva la hacen DOS fichas seguidas, y nunca un doble.
       La primera baja, la segunda sigue bajando, y la fila nueva arranca
       separada — las filas no quedan pegadas. */
    if(lleno && !dbl && sig && !sigDbl){
      out.push({k:c.k,a:c.l,b:c.r,x:cx,y:y,vert:true});
      out.push({k:sig.k,a:sig.l,b:sig.r,x:cx,y:y+2*U,vert:true});
      y+=3*U; dir=-dir; cx+=dir*U; col=1; i++;
      continue;
    }
    /* si toca curva pero hay un doble de por medio, se sigue en línea
       y la curva se hace más adelante (tope de desborde: 3 columnas) */
    if(lleno && col+2>maxCols+3 && !dbl){
      out.push({k:c.k,a:c.l,b:c.r,x:cx,y:y,vert:true});
      y+=2*U; dir=-dir; cx+=dir*U; col=1;
      continue;
    }
    if(dbl){
      out.push({k:c.k,a:c.l,b:c.r,x:cx,y:y-U/2,vert:true});
      cx+=dir*U; col+=1;
    } else {
      var left=(dir===1)?cx:cx-U;
      var f=(dir===1)?[c.l,c.r]:[c.r,c.l];
      out.push({k:c.k,a:f[0],b:f[1],x:left,y:y,vert:false});
      cx+=dir*2*U; col+=2;
    }
  }
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  out.forEach(function(o){
    var w=o.vert?U:2*U, h=o.vert?2*U:U;
    if(o.x<minX)minX=o.x; if(o.y<minY)minY=o.y;
    if(o.x+w>maxX)maxX=o.x+w; if(o.y+h>maxY)maxY=o.y+h;
  });
  if(!out.length){minX=minY=maxX=maxY=0;}
  out.forEach(function(o){ o.x-=minX; o.y-=minY; });
  return {tiles:out, w:maxX-minX, h:maxY-minY, U:U};
}

function mesa(){

  var L=layout(S.chain, box.clientWidth-24);

function jugarYo(k,side){
  var mv=legal(ME), EV=evaluar(ME,mv), er=evalReal(ME,mv);
  var mioR=er.filter(function(x){return x.m[0]===k&&x.m[1]===side;})[0];
  var mejorR=Math.max.apply(null,er.map(function(x){return x.f;}));
  function top(lista){ return lista[0].m[0]===k && lista[0].m[1]===side; }
  var sirve=[];
  if(top(EV.cobro)) sirve.push("cobro");
  if(top(EV.tranca)) sirve.push("tranca");
  if(top(EV.dominar)) sirve.push("dominar");
  var ev=EV.cobro;
  var mine=ev.filter(function(x){return x.m[0]===k && x.m[1]===side;})[0] || ev[0];
  var rank=sirve.length?0:ev.indexOf(mine);
  var meta={tipo:"jugada",k:k,side:side,opciones:mv.length,rank:rank,
            cobro:mine.cobro,pierde:mine.pierde,amen:mine.amen,pts:mine.pts,
            mejor:{k:ev[0].m[0],side:ev[0].m[1],cobro:ev[0].cobro,pierde:ev[0].pierde,amen:ev[0].amen,pts:ev[0].pts},
            real:(mioR?mioR.f:0), realMax:mejorR, sirve:sirve, turno:S.jugadas.length};
  S.ultima=meta;
  play(ME,k,side,meta);
  render(); avanzar();
}

  var dom=null,mx=0; for(var k in c){ if(c[k]>mx){mx=c[k];dom=k;} }
  if(!dom||mx<2) return null;

  var NOMP={cobro:"cerrar la mesa y cobrar",tranca:"aligerar la mano para la tranca",dominar:"conservar jugadas para dominar"};

    if(!fueTranca){ salio=false; txt="La mano se cerró por <b>dominada</b>, no por tranca. Soltar peso no sirvió de nada esta vez, y cada ficha alta que botaste era una jugada menos guardada."; }

    else { salio=false; txt="La mano sí trancó, pero alguien tuvo la mano aún más baja. El plan era el correcto; se quedó corto por unos puntos."; }

function lectura(){
  var n1=hand(1).length, n2=hand(2).length;

  var desc=ALL.filter(function(k){ return !onMesa(k) && S.loc[k]!=="h"+ME; });
  if(!desc.length) return null;
  var cA={},cB={},ok=0;
  for(var it=0; it<2500 && ok<500; it++){
    var d=desc.slice(); for(var q=d.length-1;q>0;q--){var r=Math.floor(Math.random()*(q+1)),t=d[q];d[q]=d[r];d[r]=t;}
    var A=d.slice(0,n1), B=d.slice(n1,n1+n2), mal=false, z;
    for(z=0;z<A.length&&!mal;z++){ var f=F(A[z]); if(S.voids[1][f[0]]||S.voids[1][f[1]]) mal=true; }
    for(z=0;z<B.length&&!mal;z++){ var g=F(B[z]); if(S.voids[2][g[0]]||S.voids[2][g[1]]) mal=true; }
    if(mal) continue;
    ok++;
    A.forEach(function(k){cA[k]=(cA[k]||0)+1;}); B.forEach(function(k){cB[k]=(cB[k]||0)+1;});
  }
  if(ok<20) return null;
  return {t:desc.map(function(k){var a=(cA[k]||0)/ok,b=(cB[k]||0)/ok;return {k:k,a:a,b:b,p:Math.max(0,1-a-b)};}),
          pila:pila().length, n1:n1, n2:n2};
}

  if(S.log.length){ L.push(""); L.push("Bitácora (últimos "+Math.min(70,S.log.length)+" eventos):");
    S.log.slice(-70).forEach(function(x,i){ L.push("  "+x.tx+(x.pt?"   "+x.pt:"")); }); }
  $("out").value=L.join("\n");
}
